<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Baby face background -->
  <circle cx="16" cy="16" r="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="12" cy="13" r="2" fill="#374151"/>
  <circle cx="20" cy="13" r="2" fill="#374151"/>
  <circle cx="12.5" cy="12.5" r="0.5" fill="#ffffff"/>
  <circle cx="20.5" cy="12.5" r="0.5" fill="#ffffff"/>
  
  <!-- Nose -->
  <ellipse cx="16" cy="16" rx="1" ry="0.5" fill="#f59e0b"/>
  
  <!-- Mouth (crying) -->
  <path d="M 13 20 Q 16 23 19 20" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Cheeks -->
  <circle cx="9" cy="17" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="23" cy="17" r="2" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Tears -->
  <ellipse cx="10" cy="19" rx="0.8" ry="1.5" fill="#3b82f6" opacity="0.7"/>
  <ellipse cx="22" cy="19" rx="0.8" ry="1.5" fill="#3b82f6" opacity="0.7"/>
</svg>
